[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-agent research assistant: planner, parallel RAG workers, and a citing synthesizer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "ddgs>=9.0",
    "chromadb>=0.5",
    "streamlit>=1.38",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
